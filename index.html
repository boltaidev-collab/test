<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location Finder Map Module</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="location-finder" aria-labelledby="location-finder-title">
        <h1 id="location-finder-title" class="sr-only">Location finder</h1>

        <div class="location-finder__controls" role="search">
          <div class="control-group control-group--search">
            <label class="control-label" for="search-input">
              Search by postcode, city or country
            </label>
            <div class="search-row">
              <div class="search-field">
                <span class="search-field__icon" aria-hidden="true">
                  <svg
                    viewBox="0 0 20 20"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M10 1.5C6.41 1.5 3.5 4.41 3.5 8c0 4.48 6.5 10.5 6.5 10.5S16.5 12.48 16.5 8c0-3.59-2.91-6.5-6.5-6.5z"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                    <circle cx="10" cy="8" r="2.5" stroke="currentColor" stroke-width="1.5" />
                  </svg>
                </span>
                <input
                  id="search-input"
                  type="search"
                  placeholder="Enter postcode, city or country"
                  autocomplete="postal-code"
                />
              </div>
              <button id="search-button" type="button" class="btn btn-primary">
                Search
                <span class="btn__icon" aria-hidden="true">
                  <svg
                    viewBox="0 0 20 20"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5" />
                    <path
                      d="M13.5 13.5L18 18"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                    />
                  </svg>
                </span>
              </button>
            </div>
          </div>

          <div class="control-group control-group--filter">
            <label class="control-label" for="filter-select">
              Filter by location type
            </label>
            <select id="filter-select">
              <option value="all">All</option>
              <option value="head-office">Head office</option>
              <option value="depot">Depot</option>
              <option value="service">Service centre</option>
              <option value="branch">Branch</option>
            </select>
          </div>
        </div>

        <div class="location-finder__content">
          <div id="map" class="map" role="application" aria-label="Location map"></div>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="script.js"></script>
  </body>
</html>
